<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P HyperShare Pro</title>
    
    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --container-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 15px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: none;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background: #ffffff;
        }

        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        h2, h3 { color: var(--primary); text-align: center; margin-bottom: 10px; }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 8px 12px; font-size: 0.85em; width: auto; }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85em; color: var(--text-muted); }
        .input-group select, .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 8px; font-family: inherit; font-size: 0.95em;
        }

        #qrcode {
            background: white; padding: 12px; border-radius: 8px;
            display: inline-block; margin: 10px auto; border: 1px solid var(--border-color);
        }

        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 0.8em; font-weight: 600;
        }
        .bg-green { background: #d1fae5; color: #065f46; }
        .bg-yellow { background: #fef3c7; color: #92400e; }
        .bg-red { background: #fee2e2; color: #991b1b; }
        .bg-blue { background: #dbeafe; color: #1e40af; }
        .bg-gray { background: #e2e8f0; color: #475569; }

        #peer-list-container { margin: 15px 0; display: none; }
        .peer-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: #f8fafc; border-radius: 8px;
            margin-bottom: 8px; font-size: 0.9em; border: 1px solid var(--border-color);
        }

        /* Dynamic Progress Containers */
        #progress-container { margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .progress-box {
            background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .progress-bar-bg {
            background: #e2e8f0; border-radius: 6px; height: 10px; overflow: hidden; margin-top: 6px;
        }
        .progress-bar-fill {
            background: var(--primary); height: 100%; width: 0%; transition: width 0.1s linear;
        }

        .log-container { max-height: 380px; overflow-y: auto; }
        .log-item {
            padding: 10px 0; border-bottom: 1px solid var(--border-color);
            font-size: 0.88em; display: flex; flex-direction: column; gap: 2px;
        }
        .log-time { color: var(--text-muted); font-size: 0.8em; }

        .card-stack {
            display: flex; flex-direction: column; gap: 12px; max-height: 420px; overflow-y: auto;
        }
        .share-card {
            background: #f8fafc; border: 1px solid var(--border-color);
            padding: 14px; border-radius: 10px; text-align: left;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Tab Bar -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-share')">⚡ Console</button>
            <button class="tab-btn" onclick="switchTab('tab-inbox')">📥 Inbox (<span id="inbox-count">0</span>)</button>
            <button class="tab-btn" onclick="switchTab('tab-logs')">📋 Logs</button>
        </div>

        <!-- SHARE CONSOLE TAB -->
        <div id="tab-share" class="tab-content active">
            
            <!-- Host QR Code & Mesh Roster -->
            <div id="host-qr-section" style="text-align: center; margin-bottom: 15px;">
                <p style="font-size: 0.9em; color: var(--text-muted);">Scan to join the Mesh Network:</p>
                <div id="qrcode"></div>
                
                <div style="margin: 10px 0;">
                    <span id="conn-status-badge" class="badge bg-yellow">Waiting for peers...</span>
                    <span id="peer-count-badge" class="badge bg-gray">0 Devices Connected</span>
                </div>

                <div id="peer-list-container"></div>
            </div>

            <!-- Receiver Status Banner -->
            <div id="receiver-status-section" style="display: none; text-align: center; margin-bottom: 15px;">
                <span id="client-conn-badge" class="badge bg-yellow">Connecting to Host Mesh...</span>
            </div>

            <!-- Unified Send Controls -->
            <div id="send-controls" style="display: none; border-top: 1px solid var(--border-color); padding-top: 15px;">
                
                <!-- Target Selector (Only useful for Host) -->
                <div id="target-selector-group" class="input-group" style="display: none;">
                    <label>Target Device</label>
                    <select id="target-device">
                        <option value="ALL">Broadcast to Entire Mesh</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Transfer Type</label>
                    <select id="share-type" onchange="toggleInputFields()">
                        <option value="file">File (Resumable Pull Stream)</option>
                        <option value="url">URL / Web Link</option>
                        <option value="address">Physical Address</option>
                        <option value="text">Message / Raw Text</option>
                    </select>
                </div>

                <div id="input-file" class="input-group">
                    <input type="file" id="p2p-file">
                </div>
                <div id="input-url" class="input-group" style="display: none;">
                    <input type="text" id="p2p-url" placeholder="google.com or https://example.com">
                </div>
                <div id="input-address" class="input-group" style="display: none;">
                    <textarea id="p2p-address" rows="3" placeholder="Enter street address..."></textarea>
                </div>
                <div id="input-text" class="input-group" style="display: none;">
                    <textarea id="p2p-text" rows="3" placeholder="Type plain text message..."></textarea>
                </div>

                <!-- Dynamic Progress Bars inject here -->
                <div id="progress-container"></div>

                <button class="btn btn-primary" id="send-btn" onclick="initiateTransfer()">Send Data</button>
            </div>
        </div>

        <!-- RECEIVED ITEMS TAB -->
        <div id="tab-inbox" class="tab-content">
            <h3 style="text-align: left;">Inbox Stack</h3>
            <div id="inbox-stack" class="card-stack">
                <p id="empty-inbox-msg" style="color: var(--text-muted); text-align: center; padding: 20px;">No items received yet.</p>
            </div>
        </div>

        <!-- ACTIVITY LOGS TAB -->
        <div id="tab-logs" class="tab-content">
            <h3 style="text-align: left;">Session Audit Trail</h3>
            <div class="log-container" id="log-list"></div>
        </div>
    </div>

    <script>
        const CHUNK_SIZE = 64 * 1024; // 64KB
        let peerInstance = null;
        
        // Maps devId to connections
        let connectedPeers = new Map(); 
        let hostConnection = null; 

        // Transfer Data Memory
        let sharedFiles = new Map(); // Holds files being hosted by this device
        let incomingStreams = {};    // Holds buffers of files being downloaded

        let sessionPin = Math.random().toString(36).substring(2, 8).toUpperCase();
        let isHost = true;
        let myLocation = null;
        let inboxCounter = 0;

        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        // --- IDENTITY MANAGEMENT ---
        function getMyDeviceId() {
            let id = localStorage.getItem('hyper_share_id');
            if (!id) {
                id = Math.random().toString(36).substr(2, 10);
                localStorage.setItem('hyper_share_id', id);
            }
            return id;
        }

        function getMyDeviceName() {
            let name = localStorage.getItem('hyper_share_name');
            if (!name) {
                const agent = navigator.userAgent;
                let os = "Web Peer";
                if (/android/i.test(agent)) os = "Android";
                else if (/iPad|iPhone|iPod/.test(agent)) os = "iOS";
                else if (/Mac OS/.test(agent)) os = "Mac";
                else if (/Windows/.test(agent)) os = "Windows PC";
                
                name = `${os}-${Math.floor(1000 + Math.random() * 9000)}`;
                localStorage.setItem('hyper_share_name', name);
            }
            return name;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const receivePeer = urlParams.get('receive_peer');
            const pin = urlParams.get('pin');

            getGeo(loc => { myLocation = loc; });

            if (receivePeer && pin) {
                isHost = false;
                document.getElementById('host-qr-section').style.display = 'none';
                document.getElementById('receiver-status-section').style.display = 'block';
                initClient(receivePeer, pin);
            } else {
                initHost();
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function toggleInputFields() {
            const type = document.getElementById('share-type').value;
            ['file', 'url', 'address', 'text'].forEach(t => {
                document.getElementById(`input-${t}`).style.display = type === t ? 'block' : 'none';
            });
        }

        function addLog(msg, isErr = false) {
            const list = document.getElementById('log-list');
            const now = new Date().toLocaleTimeString();
            const el = document.createElement('div');
            el.className = 'log-item';
            el.innerHTML = `
                <span style="color: ${isErr ? '#ef4444' : '#1e293b'}; font-weight: 500;">${msg}</span>
                <span class="log-time">${now}</span>
            `;
            list.prepend(el);
        }

        // --- HOST LOGIC ---
        function initHost() {
            addLog(`Session created. PIN: ${sessionPin}`);
            document.getElementById('target-selector-group').style.display = 'block';
            peerInstance = new Peer(peerConfig);

            peerInstance.on('open', (id) => {
                const link = `${window.location.href.split('?')[0]}?receive_peer=${id}&pin=${sessionPin}`;
                new QRCode(document.getElementById("qrcode"), { text: link, width: 200, height: 200 });
            });

            peerInstance.on('connection', (conn) => {
                conn.on('data', (data) => handleHostIncoming(conn, data));
                conn.on('close', () => {
                    if (conn.devId && connectedPeers.has(conn.devId)) {
                        if (connectedPeers.get(conn.devId).conn === conn) {
                            connectedPeers.delete(conn.devId);
                            updateHostUI();
                            addLog(`Device disconnected.`);
                        }
                    }
                });
            });
        }

        function handleHostIncoming(conn, data) {
            if (data.type === 'HANDSHAKE') {
                if (data.pin === sessionPin) {
                    const devId = data.deviceId;
                    if (connectedPeers.has(devId)) {
                        try { connectedPeers.get(devId).conn.close(); } catch(e){}
                    }
                    conn.devId = devId;
                    connectedPeers.set(devId, { conn: conn, name: data.deviceName, distance: 'Calculating...' });
                    updateHostUI();
                    document.getElementById('send-controls').style.display = 'block';
                    conn.send({ type: 'GEO_REQ' });
                    
                    // Auto-Resume any interrupted pulls
                    resumeInterruptedTransfers(conn);
                } else {
                    conn.send({ type: 'ERROR', msg: 'Invalid PIN' });
                    conn.close();
                }
                return;
            }

            if (data.type === 'GEO_RES') {
                const devId = conn.devId;
                if (connectedPeers.has(devId)) {
                    let peer = connectedPeers.get(devId);
                    if (data.loc && myLocation) {
                        const meters = calcDistance(myLocation.lat, myLocation.lon, data.loc.lat, data.loc.lon);
                        peer.distance = meters < 1000 ? `~${Math.round(meters)}m` : `~${(meters / 1000).toFixed(1)}km`;
                    } else { peer.distance = 'Location Denied'; }
                    updateHostUI();
                }
                return;
            }

            processStandardPayload(conn, data);
        }

        function updateHostUI() {
            if (!isHost) return;
            const countBadge = document.getElementById('peer-count-badge');
            const connBadge = document.getElementById('conn-status-badge');
            const listContainer = document.getElementById('peer-list-container');
            const targetSelect = document.getElementById('target-device');
            
            countBadge.innerText = `${connectedPeers.size} Device(s) Connected`;
            targetSelect.innerHTML = '<option value="ALL">Broadcast to Entire Mesh</option>';
            
            if (connectedPeers.size > 0) {
                connBadge.className = 'badge bg-green';
                connBadge.innerText = 'Mesh Active';
                listContainer.style.display = 'block';
                
                let html = '';
                connectedPeers.forEach((peer, id) => {
                    html += `<div class="peer-list-item">
                                <strong>📱 ${peer.name}</strong> 
                                <span class="badge bg-blue">📍 ${peer.distance}</span>
                             </div>`;
                    targetSelect.innerHTML += `<option value="${id}">${peer.name}</option>`;
                });
                listContainer.innerHTML = html;
            } else {
                connBadge.className = 'badge bg-yellow';
                connBadge.innerText = 'Waiting for peers...';
                listContainer.style.display = 'none';
                document.getElementById('send-controls').style.display = 'none';
            }
        }

        // --- CLIENT LOGIC ---
        function initClient(targetHostId, targetPin) {
            peerInstance = new Peer(peerConfig);
            peerInstance.on('open', () => {
                hostConnection = peerInstance.connect(targetHostId);
                
                hostConnection.on('open', () => {
                    hostConnection.send({ 
                        type: 'HANDSHAKE', pin: targetPin, 
                        deviceId: getMyDeviceId(), deviceName: getMyDeviceName()
                    });
                    
                    document.getElementById('client-conn-badge').className = 'badge bg-green';
                    document.getElementById('client-conn-badge').innerText = '✅ Connected to Host';
                    document.getElementById('send-controls').style.display = 'block';
                    addLog('Secured connection established.');

                    // Auto-Resume any interrupted pulls
                    resumeInterruptedTransfers(hostConnection);
                });

                hostConnection.on('data', (data) => {
                    if (data.type === 'GEO_REQ') {
                        getGeo(loc => { hostConnection.send({ type: 'GEO_RES', loc: loc }); });
                        return;
                    }
                    if (data.type === 'ERROR') return alert(data.msg);
                    processStandardPayload(hostConnection, data);
                });

                hostConnection.on('close', () => {
                    hostConnection = null;
                    document.getElementById('client-conn-badge').className = 'badge bg-red';
                    document.getElementById('client-conn-badge').innerText = '❌ Disconnected (Auto-Reconnecting...)';
                    document.getElementById('send-controls').style.display = 'none';
                    addLog('Connection closed. Refresh page to re-join.', true);
                });
            });
        }

        // --- PULL-BASED FILE PROTOCOL & PAYLOADS ---
        function resumeInterruptedTransfers(conn) {
            Object.keys(incomingStreams).forEach(transferId => {
                const stream = incomingStreams[transferId];
                const nextIdx = stream.chunks.length;
                if (nextIdx < stream.totalChunks) {
                    conn.send({ type: 'CHUNK_REQ', transferId, index: nextIdx });
                    addLog(`Resuming download: ${stream.name}`);
                }
            });
        }

        function processStandardPayload(conn, data) {
            // RECEIVER side: Getting a file offer, initiates pull
            if (data.type === 'FILE_OFFER') {
                if (!incomingStreams[data.transferId]) {
                    incomingStreams[data.transferId] = { 
                        name: data.name, size: data.size, mime: data.mime, 
                        totalChunks: data.totalChunks, chunks: [] 
                    };
                }
                const nextIdx = incomingStreams[data.transferId].chunks.length;
                if (nextIdx < data.totalChunks) {
                    conn.send({ type: 'CHUNK_REQ', transferId: data.transferId, index: nextIdx });
                    showProgressUI(data.transferId, `Downloading: ${data.name}`, Math.round((nextIdx/data.totalChunks)*100));
                }
                return;
            }

            // SENDER side: Fulfilling a chunk request (Tracks true receiver progress)
            if (data.type === 'CHUNK_REQ') {
                const sf = sharedFiles.get(data.transferId);
                if (!sf) {
                    conn.send({ type: 'FILE_ERROR', transferId: data.transferId, msg: 'File no longer available on host.' });
                    return;
                }
                
                const percent = Math.round(((data.index + 1) / sf.totalChunks) * 100);
                showProgressUI(data.transferId, `Uploading: ${sf.name}`, percent);

                const start = data.index * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, sf.size);
                
                sf.file.slice(start, end).arrayBuffer().then(buffer => {
                    conn.send({ type: 'FILE_CHUNK', transferId: data.transferId, index: data.index, chunk: buffer });
                });
                return;
            }

            // RECEIVER side: Receiving a pulled chunk
            if (data.type === 'FILE_CHUNK') {
                const stream = incomingStreams[data.transferId];
                if (!stream) return;
                
                // Ensure sequence is maintained (prevents duplicate storage)
                if (data.index === stream.chunks.length) {
                    stream.chunks.push(data.chunk);
                    const percent = Math.round((stream.chunks.length / stream.totalChunks) * 100);
                    showProgressUI(data.transferId, `Downloading: ${stream.name}`, percent);

                    if (stream.chunks.length >= stream.totalChunks) {
                        const blob = new Blob(stream.chunks, { type: stream.mime || 'application/octet-stream' });
                        renderInboxCard({ type: 'file', fileBlob: blob, name: stream.name });
                        addLog(`Received File: ${stream.name}`);
                        delete incomingStreams[data.transferId];
                        hideProgressUI(data.transferId);
                    } else {
                        // Request the very next piece securely
                        conn.send({ type: 'CHUNK_REQ', transferId: data.transferId, index: data.index + 1 });
                    }
                }
                return;
            }

            if (data.type === 'FILE_ERROR') {
                alert(data.msg);
                delete incomingStreams[data.transferId];
                hideProgressUI(data.transferId);
                return;
            }

            // Simple Payloads
            if (['url', 'text', 'address'].includes(data.type)) {
                renderInboxCard(data);
                addLog(`Received ${data.type.toUpperCase()}`);
            }
        }

        // --- INITIATE TRANSFERS ---
        function safeSendToTargets(payload, targetId = 'ALL') {
            if (isHost) {
                if (targetId === 'ALL') {
                    connectedPeers.forEach(peer => { try { if (peer.conn.open) peer.conn.send(payload); } catch(e){} });
                } else {
                    if (connectedPeers.has(targetId)) {
                        try { let p = connectedPeers.get(targetId); if (p.conn.open) p.conn.send(payload); } catch(e){}
                    }
                }
            } else {
                if (hostConnection && hostConnection.open) hostConnection.send(payload);
            }
        }

        async function initiateTransfer() {
            if (isHost && connectedPeers.size === 0) return alert("No active connections in mesh.");
            if (!isHost && (!hostConnection || !hostConnection.open)) return alert("Not connected to host.");

            const type = document.getElementById('share-type').value;
            const targetId = isHost ? document.getElementById('target-device').value : 'ALL';

            if (type === 'file') {
                const file = document.getElementById('p2p-file').files[0];
                if (!file) return alert("Select a file to transfer.");

                // Register file in memory so peers can pull it
                const transferId = Math.random().toString(36).substring(2, 9);
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                sharedFiles.set(transferId, { file: file, name: file.name, size: file.size, totalChunks: totalChunks, mime: file.type });

                // Dispatch the Offer
                safeSendToTargets({ type: 'FILE_OFFER', transferId, name: file.name, size: file.size, totalChunks, mime: file.type }, targetId);
                showProgressUI(transferId, `Waiting for receiver to pull: ${file.name}`, 0);
                
                document.getElementById('p2p-file').value = '';
                addLog(`Offered File to Mesh: ${file.name}`);
            } else {
                let payload = { type: type };
                if (type === 'url') {
                    let u = document.getElementById('p2p-url').value.trim();
                    if (!u) return;
                    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
                    payload.content = u;
                } else if (type === 'address') {
                    payload.content = document.getElementById('p2p-address').value.trim();
                } else if (type === 'text') {
                    payload.content = document.getElementById('p2p-text').value.trim();
                }

                if (!payload.content) return;
                safeSendToTargets(payload, targetId);
                document.getElementById(`p2p-${type}`).value = '';
                addLog(`Sent ${type} ${targetId === 'ALL' ? 'to Mesh' : 'to Target'}`);
            }
        }

        // --- DYNAMIC PROGRESS BARS UI ---
        function showProgressUI(transferId, status, percent) {
            let container = document.getElementById('progress-container');
            let box = document.getElementById(`prog-${transferId}`);
            
            if (!box) {
                box = document.createElement('div');
                box.id = `prog-${transferId}`;
                box.className = 'progress-box';
                box.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-size: 0.85em; font-weight: 600;">
                        <span id="status-${transferId}">${status}</span>
                        <span id="percent-${transferId}">${percent}%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="bar-${transferId}" class="progress-bar-fill" style="width: ${percent}%;"></div>
                    </div>
                `;
                container.appendChild(box);
            } else {
                document.getElementById(`status-${transferId}`).innerText = status;
                document.getElementById(`percent-${transferId}`).innerText = `${percent}%`;
                document.getElementById(`bar-${transferId}`).style.width = `${percent}%`;
            }
        }

        function hideProgressUI(transferId) {
            const box = document.getElementById(`prog-${transferId}`);
            if (box) setTimeout(() => { box.remove(); }, 1500); // Remove cleanly after 1.5 seconds
        }

        // --- INBOX & UTILS ---
        function renderInboxCard(data) {
            document.getElementById('empty-inbox-msg').style.display = 'none';
            inboxCounter++;
            document.getElementById('inbox-count').innerText = inboxCounter;

            const stack = document.getElementById('inbox-stack');
            const card = document.createElement('div');
            card.className = 'share-card';

            let bodyHtml = '', actionsHtml = '';

            if (data.type === 'file') {
                const url = URL.createObjectURL(data.fileBlob);
                bodyHtml = `<strong>📁 File:</strong> ${data.name}`;
                actionsHtml = `
                    <a href="${url}" download="${data.name}" class="btn btn-primary btn-sm">💾 Download</a>
                    <button class="btn btn-secondary btn-sm" onclick="triggerWebShare('${data.name}', '${data.name}', '${url}')">📤 Native Share</button>
                `;
            } else if (data.type === 'url') {
                bodyHtml = `<strong>🔗 URL:</strong><br><a href="${data.content}" target="_blank" style="color:var(--primary); word-break:break-all;">${data.content}</a>`;
                actionsHtml = `
                    <button class="btn btn-primary btn-sm" onclick="window.open('${data.content}', '_blank')">🚀 Launch</button>
                    <button class="btn btn-secondary btn-sm" onclick="triggerWebShare('Link', '${data.content}', '${data.content}')">📤 Share</button>
                `;
                window.open(data.content, '_blank');
            } else if (data.type === 'address') {
                bodyHtml = `<strong>📍 Address:</strong><br>${data.content.replace(/\n/g, '<br>')}`;
                actionsHtml = `
                    <button class="btn btn-success btn-sm" onclick="saveVCard(\`${data.content}\`)">💾 Add Contact</button>
                    <button class="btn btn-secondary btn-sm" onclick="triggerWebShare('Address', '${data.content}')">📤 Share</button>
                `;
            } else if (data.type === 'text') {
                bodyHtml = `<strong>💬 Text:</strong><br><span style="word-break:break-all;">${data.content.replace(/\n/g, '<br>')}</span>`;
                actionsHtml = `
                    <button class="btn btn-primary btn-sm" onclick="navigator.clipboard.writeText(\`${data.content}\`); this.innerText='✓ Copied!';">📋 Copy</button>
                    <button class="btn btn-secondary btn-sm" onclick="triggerWebShare('Message', '${data.content}')">📤 Share</button>
                `;
            }

            card.innerHTML = `<div style="margin-bottom: 8px;">${bodyHtml}</div><div style="display: flex; gap: 8px; flex-wrap: wrap;">${actionsHtml}</div>`;
            stack.prepend(card);
        }

        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const f1 = lat1 * Math.PI / 180, f2 = lat2 * Math.PI / 180;
            const df = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(df / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getGeo(callback) {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => callback({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => callback(null), { timeout: 5000 }
                );
            } else { callback(null); }
        }

        function triggerWebShare(title, text, url) {
            if (navigator.share) { navigator.share({ title, text, url: url || undefined }).catch(()=>{}); } 
            else { navigator.clipboard.writeText(url || text); alert("Copied to clipboard (Native sharing unsupported here)."); }
        }

        function saveVCard(addr) {
            const vcf = `BEGIN:VCARD\nVERSION:3.0\nFN:Shared Location\nADR:;;${addr.replace(/\n/g, ', ')}\nEND:VCARD`;
            const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'shared_address.vcf';
            a.click(); URL.revokeObjectURL(url);
        }
    </script>
</body>
