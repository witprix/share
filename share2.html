<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Wi-Fi Share</title>
    
    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --container-bg: white;
            --text-main: #333;
            --border-color: #e5e7eb;
            --active-tab: #4f46e5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
        }
        .tab-btn.active {
            color: var(--active-tab);
            border-bottom: 3px solid var(--active-tab);
            background: white;
        }
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }

        h2, h3 { color: var(--active-tab); margin-top: 0; text-align: center; }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1em;
            margin-bottom: 10px;
        }
        .btn-primary { background: var(--active-tab); color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: #f1f5f9; color: #333; border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-success { background: #10b981; color: white; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        .input-group select, .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 6px; box-sizing: border-box; font-family: inherit;
        }

        #qrcode {
            background: white; padding: 15px; border-radius: 8px;
            display: inline-block; margin: 15px auto; border: 1px solid var(--border-color);
        }

        /* Status & Badges */
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 4px;
            font-size: 0.8em; font-weight: bold; margin-top: 5px;
        }
        .bg-green { background: #d1fae5; color: #065f46; }
        .bg-yellow { background: #fef3c7; color: #92400e; }
        .bg-red { background: #fee2e2; color: #991b1b; }
        .bg-blue { background: #dbeafe; color: #1e40af; }

        /* Log Table */
        .log-container { max-height: 400px; overflow-y: auto; }
        .log-item {
            padding: 10px; border-bottom: 1px solid var(--border-color);
            font-size: 0.9em; display: flex; flex-direction: column; gap: 4px;
        }
        .log-item:last-child { border-bottom: none; }
        .log-time { color: #64748b; font-size: 0.85em; }

        /* Receiver Overlay */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: flex-start;
            color: white; text-align: center; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        .receiver-card {
            background: white; color: #333; padding: 20px; border-radius: 12px;
            max-width: 400px; width: 100%; margin-bottom: 15px; text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- RECEIVER OVERLAY -->
    <div id="receive-overlay" class="overlay">
        <h2 style="color:white; margin-top: 20px;">📥 Connected Receiver</h2>
        <div id="recv-status-badge" class="badge bg-yellow" style="margin-bottom: 15px;">Establishing Secure Connection...</div>
        
        <div id="received-stack" style="width: 100%; max-width: 400px; display: flex; flex-direction: column;"></div>

        <button class="btn btn-secondary" style="margin-top: 20px; max-width: 200px;" onclick="window.location.href=window.location.href.split('?')[0]">Disconnect</button>
    </div>

    <!-- SENDER UI -->
    <div class="container" id="sender-ui">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-share')">📤 Share</button>
            <button class="tab-btn" onclick="switchTab('tab-logs')">📋 Activity Logs</button>
        </div>

        <!-- SHARE TAB -->
        <div id="tab-share" class="tab-content active">
            <div id="p2p-qr-container" style="text-align:center;">
                <p style="margin:0; font-size:0.95em; color:#64748b;">Scan QR to securely connect</p>
                <div id="qrcode"></div>
                
                <div style="margin: 10px 0;">
                    <span id="conn-status-badge" class="badge bg-yellow">Waiting for receiver...</span>
                    <span id="dist-badge" class="badge bg-blue" style="display:none;">Distance: Estimating...</span>
                </div>
            </div>
            
            <div id="p2p-send-controls" style="display:none; text-align: left; margin-top: 20px; border-top: 1px solid #e5e7eb; padding-top: 20px;">
                <div class="input-group">
                    <label>What do you want to share?</label>
                    <select id="share-type" onchange="toggleInputFields()">
                        <option value="file">File (Max 50MB)</option>
                        <option value="url">URL / Link</option>
                        <option value="address">Address</option>
                        <option value="text">Raw Text</option>
                    </select>
                </div>

                <div id="input-file" class="input-group">
                    <input type="file" id="p2p-file">
                </div>
                
                <div id="input-url" class="input-group" style="display:none;">
                    <input type="text" id="p2p-url" placeholder="example.com or https://example.com">
                </div>

                <div id="input-address" class="input-group" style="display:none;">
                    <textarea id="p2p-address" rows="3" placeholder="Enter physical address..."></textarea>
                </div>

                <div id="input-text" class="input-group" style="display:none;">
                    <textarea id="p2p-text" rows="4" placeholder="Type message here..."></textarea>
                </div>

                <button class="btn btn-primary" id="send-btn" onclick="sendData()">Send to Device</button>
            </div>
        </div>

        <!-- LOGS TAB -->
        <div id="tab-logs" class="tab-content">
            <h3 style="text-align:left; margin-bottom: 15px;">Session Activity</h3>
            <div class="log-container" id="log-list">
                <!-- Logs will appear here -->
            </div>
        </div>
    </div>

    <script>
        let peerInstance = null;
        let activeConnection = null;
        let sessionPin = Math.random().toString(36).substring(2, 8).toUpperCase(); // Secure PIN for reconnects
        let myLocation = null;

        const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB

        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        // Initialize immediately on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('receive_peer')) {
                document.getElementById('sender-ui').style.display = 'none';
                initReceiver(urlParams);
            } else {
                initSender();
            }
        });

        // --- UI UTILS ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleInputFields() {
            const type = document.getElementById('share-type').value;
            ['file', 'url', 'address', 'text'].forEach(t => {
                document.getElementById(`input-${t}`).style.display = type === t ? 'block' : 'none';
            });
        }

        function addLog(message, isSuccess = true) {
            const logList = document.getElementById('log-list');
            const now = new Date().toLocaleTimeString();
            const color = isSuccess ? '#333' : '#991b1b';
            const logHTML = `
                <div class="log-item">
                    <span style="color: ${color}; font-weight: 500;">${message}</span>
                    <span class="log-time">${now}</span>
                </div>
            `;
            logList.insertAdjacentHTML('afterbegin', logHTML); // Prepend
        }

        function getDeviceName(agentStr) {
            if (/windows phone/i.test(agentStr)) return "Windows Phone";
            if (/android/i.test(agentStr)) return "Android";
            if (/iPad|iPhone|iPod/.test(agentStr) && !window.MSStream) return "iOS Device";
            if (/Mac OS/.test(agentStr)) return "Mac";
            if (/Windows/.test(agentStr)) return "Windows PC";
            return "Unknown Device";
        }

        // --- GEOLOCATION MATH (HAVERSINE) ---
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const f1 = lat1 * Math.PI/180;
            const f2 = lat2 * Math.PI/180;
            const df = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function requestLocation(callback) {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => callback({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    err => callback(null)
                );
            } else {
                callback(null);
            }
        }

        // --- SENDER LOGIC ---
        function initSender() {
            addLog(`Session started. PIN: ${sessionPin}`);
            peerInstance = new Peer(peerConfig);
            
            // Get sender location early
            requestLocation(loc => { myLocation = loc; });

            peerInstance.on('open', (id) => {
                const qrUrl = `${window.location.href.split('?')[0]}?receive_peer=${id}&pin=${sessionPin}`;
                new QRCode(document.getElementById("qrcode"), { text: qrUrl, width: 220, height: 220 });
            });
            
            peerInstance.on('connection', (conn) => {
                conn.on('open', () => {
                    // Start unverified
                });

                conn.on('data', (data) => {
                    // 1. Handshake Verification
                    if (data.type === 'HANDSHAKE') {
                        if (data.pin === sessionPin) {
                            activeConnection = conn;
                            const device = getDeviceName(data.agent);
                            addLog(`Securely connected to ${device}`, true);
                            
                            const badge = document.getElementById('conn-status-badge');
                            badge.className = 'badge bg-green';
                            badge.innerText = '✅ Secured & Connected';
                            document.getElementById('p2p-send-controls').style.display = 'block';

                            // Ask receiver for their location to calculate distance
                            conn.send({ type: 'GEO_REQ' });
                        } else {
                            conn.send({ type: 'ERROR', msg: 'Invalid PIN.' });
                            conn.close();
                            addLog(`Rejected unauthorized connection attempt.`, false);
                        }
                    }
                    
                    // 2. Receive Geolocation for Distance
                    if (data.type === 'GEO_RES' && data.loc && myLocation) {
                        const distMeters = calcDistance(myLocation.lat, myLocation.lon, data.loc.lat, data.loc.lon);
                        const distBadge = document.getElementById('dist-badge');
                        distBadge.style.display = 'inline-block';
                        
                        if (distMeters < 1000) {
                            distBadge.innerText = `📍 Distance: ${Math.round(distMeters)} meters`;
                        } else {
                            distBadge.innerText = `📍 Distance: ${(distMeters/1000).toFixed(2)} km`;
                        }
                        addLog(`Receiver is approx ${distBadge.innerText.split(': ')[1]} away.`);
                    }
                });

                conn.on('close', () => {
                    if (activeConnection === conn) {
                        document.getElementById('conn-status-badge').className = 'badge bg-red';
                        document.getElementById('conn-status-badge').innerText = '❌ Disconnected. Waiting for reconnect...';
                        document.getElementById('p2p-send-controls').style.display = 'none';
                        document.getElementById('dist-badge').style.display = 'none';
                        addLog(`Receiver disconnected or refreshed. Waiting...`, false);
                        activeConnection = null;
                    }
                });
            });
        }

        async function sendData() {
            if (!activeConnection || !activeConnection.open) return alert("Receiver not connected.");
            
            const btn = document.getElementById('send-btn');
            const type = document.getElementById('share-type').value;
            let payload = { type: type };

            if (type === 'file') {
                const file = document.getElementById('p2p-file').files[0];
                if (!file) return alert("Select a file.");
                if (file.size > MAX_FILE_SIZE) return alert("File exceeds 50MB limit.");
                
                btn.innerText = 'Sending...'; btn.disabled = true;
                payload.file = await file.arrayBuffer();
                payload.name = file.name;
                addLog(`Sent File: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`);
            } else if (type === 'url') {
                let rawUrl = document.getElementById('p2p-url').value.trim();
                if (!rawUrl) return;
                if (!/^https?:\/\//i.test(rawUrl)) rawUrl = 'https://' + rawUrl;
                payload.content = rawUrl;
                addLog(`Sent URL: ${rawUrl}`);
            } else if (type === 'address' || type === 'text') {
                payload.content = document.getElementById(`p2p-${type}`).value.trim();
                if (!payload.content) return;
                addLog(`Sent ${type.charAt(0).toUpperCase() + type.slice(1)} payload.`);
            }

            try {
                activeConnection.send(payload);
                document.getElementById(`p2p-${type}`).value = ''; // clear input
            } catch (err) {
                addLog(`Transfer failed: ${err.message}`, false);
            } finally {
                btn.innerText = 'Send to Device'; btn.disabled = false;
            }
        }

        // --- RECEIVER LOGIC ---
        function initReceiver(urlParams) {
            document.getElementById('receive-overlay').style.display = 'flex';
            const targetId = urlParams.get('receive_peer');
            const targetPin = urlParams.get('pin');
            
            peerInstance = new Peer(peerConfig);
            
            peerInstance.on('open', () => {
                activeConnection = peerInstance.connect(targetId);
                
                activeConnection.on('open', () => {
                    // Send Secure Handshake
                    activeConnection.send({ 
                        type: 'HANDSHAKE', 
                        pin: targetPin, 
                        agent: navigator.userAgent 
                    });
                    
                    const badge = document.getElementById('recv-status-badge');
                    badge.className = 'badge bg-green';
                    badge.innerText = '✅ Secured & Ready';
                });
                
                activeConnection.on('data', (data) => {
                    if (data.type === 'GEO_REQ') {
                        requestLocation(loc => {
                            if (loc) activeConnection.send({ type: 'GEO_RES', loc: loc });
                        });
                        return;
                    }
                    if (data.type === 'ERROR') {
                        alert(data.msg);
                        return;
                    }

                    // Process Share Payload
                    const stack = document.getElementById('received-stack');
                    const card = document.createElement('div');
                    card.className = 'receiver-card';
                    
                    let bodyHtml = '', actionHtml = '';

                    if (data.type === 'file' || data.file) {
                        bodyHtml = `<strong>File:</strong> ${data.name}`;
                        downloadFile(data.file, data.name);
                        actionHtml = `<p style="color: #10b981; font-weight: bold; margin:0;">✓ Downloaded</p>`;
                    } else if (data.type === 'url') {
                        bodyHtml = `<strong>URL:</strong><br><a href="${data.content}" target="_blank" style="color:#4f46e5; word-break:break-all;">${data.content}</a>`;
                        actionHtml = `<button class="btn btn-primary" onclick="window.open('${data.content}', '_blank')">🚀 Open Website</button>`;
                        if (!window.open(data.content, '_blank')) {
                            actionHtml = `<p style="color:#64748b; font-size:0.85em; margin-bottom:8px;">(Tap below to launch)</p>` + actionHtml;
                        }
                    } else if (data.type === 'address') {
                        bodyHtml = `<strong>Address:</strong><br>${data.content.replace(/\n/g, '<br>')}`;
                        actionHtml = `<button class="btn btn-success" onclick="saveAsVCard(\`${data.content}\`)">💾 Save Contact (.vcf)</button>`;
                    } else if (data.type === 'text') {
                        bodyHtml = `<strong>Text:</strong><br><span style="word-break:break-all;">${data.content.replace(/\n/g, '<br>')}</span>`;
                        actionHtml = `<button class="btn btn-primary" onclick="navigator.clipboard.writeText(\`${data.content}\`); this.innerText='✓ Copied!';">📋 Copy</button>`;
                    }

                    card.innerHTML = `<div style="margin-bottom: 10px;">${bodyHtml}</div><div>${actionHtml}</div>`;
                    stack.prepend(card);
                });

                activeConnection.on('close', () => {
                    const badge = document.getElementById('recv-status-badge');
                    badge.className = 'badge bg-red';
                    badge.innerText = '❌ Sender Disconnected';
                });
            });
        }

        // --- UTILS ---
        function downloadFile(fileBytes, filename) {
            const blob = new Blob([fileBytes]);
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = filename;
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); window.URL.revokeObjectURL(url);
        }

        function saveAsVCard(addressText) {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:Shared Address\nADR:;;${addressText.replace(/\n/g, ', ')}\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = 'address.vcf';
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
